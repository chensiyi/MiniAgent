<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MiniAgent Bookmarklet</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #0f1115;
        color: #e6e6e6;
      }
      #app {
        padding: 12px;
        font-size: 13px;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div id="app">MiniAgent 加载中…</div>

    <!-- 顺序保证：basement 核心 + 渲染库先于 bookmarklet.js 就绪。
         MiniAgent 全局由 basement IIFE 写入 window，故 bookmarklet.js 顶层可安全消费。
         host.html 由 GitHub Pages 托管（固定源，使 iframe 内 localStorage 跨站统一）；
         bookmarklet.js 仍走 jsDelivr CDN。 -->
    <script src="https://cdn.jsdelivr.net/gh/chensiyi/MiniAgent@basement-0.2.6/dist/miniagent-basement.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/chensiyi/MiniAgent@bookmarklet/dist/bookmarklet.js"></script>
  </body>
</html>
